<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Misión Módulo 2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Plataforma de estudio accesible del Módulo 2 de Prepa Abierta: El lenguaje en la relación del hombre con el mundo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Lexend:wght@400;600;800&display=swap">
<style>/* Concepto: "Cuaderno de misiones" — app de bolsillo. Cada tema es una hoja con margen y resaltador;
   las opciones son los óvalos de la hoja de respuestas. Azul tinta: el color del lenguaje escrito. */
:root {
  --bg: #f3f6fb;
  --surface: #ffffff;
  --surface-2: #e9eff9;
  --ink: #14213d;
  --muted: #52607a;
  --line: #d6dfee;
  --accent: #1f5fd1;
  --accent-2: #4a84e8;
  --accent-soft: #e2ecff;
  --on-accent: #ffffff;
  --mark: #ffd96a;
  --mark-ink: #14213d;
  --ok: #13805a;
  --ok-soft: #dcf4e8;
  --bad: #bf3a3a;
  --bad-soft: #fde5e3;
  --warn: #965a00;
  --warn-soft: #fff0d4;
  --margin-rule: #f2b8a8;
  --art-1: #1f5fd1; --art-2: #ffb547; --art-3: #ef6f5e; --art-4: #37b38a; --art-paper: #ffffff;
  --shadow: 0 1px 2px rgba(20, 40, 90, .06), 0 6px 18px rgba(20, 40, 90, .07);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --r: 14px;
  /* Ajustes de lectura (se cambian desde el botón Aa) */
  --fs: 17px; --lh: 1.6; --ls: 0; --ws: 0;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1522; --surface: #172034; --surface-2: #1f2a42; --ink: #e8eefb; --muted: #a3b3cf; --line: #2a3653;
    --accent: #8ab4ff; --accent-2: #a9c8ff; --accent-soft: #1d2d52; --on-accent: #0b1530;
    --mark: #6b5512; --mark-ink: #fff3cc; --ok: #5fd39f; --ok-soft: #133325; --bad: #ff8a80; --bad-soft: #3b1d1d;
    --warn: #ffc56b; --warn-soft: #3a2b12; --margin-rule: #5a3b34;
    --art-1: #8ab4ff; --art-2: #ffc670; --art-3: #ff8f80; --art-4: #5fd39f; --art-paper: #223050;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1522; --surface: #172034; --surface-2: #1f2a42; --ink: #e8eefb; --muted: #a3b3cf; --line: #2a3653;
  --accent: #8ab4ff; --accent-2: #a9c8ff; --accent-soft: #1d2d52; --on-accent: #0b1530;
  --mark: #6b5512; --mark-ink: #fff3cc; --ok: #5fd39f; --ok-soft: #133325; --bad: #ff8a80; --bad-soft: #3b1d1d;
  --warn: #ffc56b; --warn-soft: #3a2b12; --margin-rule: #5a3b34;
  --art-1: #8ab4ff; --art-2: #ffc670; --art-3: #ff8f80; --art-4: #5fd39f; --art-paper: #223050;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  color-scheme: dark;
}
/* Fondos suaves para lectura (ayudan a muchas personas con dislexia). Solo en modo claro. */
:root[data-theme="light"][data-tint="crema"] { --bg: #f8f1df; --surface: #fffaee; --surface-2: #f1e8d2; --line: #e5d9bb; }
:root[data-theme="light"][data-tint="azul"] { --bg: #e3eefa; --surface: #f4f9ff; --surface-2: #dbe8f8; --line: #c9daf0; }
:root[data-theme="light"][data-tint="verde"] { --bg: #e7f3e6; --surface: #f6fcf4; --surface-2: #dcecd9; --line: #c8e0c3; }
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"])[data-tint="crema"] { --bg: #f8f1df; --surface: #fffaee; --surface-2: #f1e8d2; --line: #e5d9bb; }
  :root:not([data-theme="dark"])[data-tint="azul"] { --bg: #e3eefa; --surface: #f4f9ff; --surface-2: #dbe8f8; --line: #c9daf0; }
  :root:not([data-theme="dark"])[data-tint="verde"] { --bg: #e7f3e6; --surface: #f6fcf4; --surface-2: #dcecd9; --line: #c8e0c3; }
}
:root[data-font="lexend"] { --font-body: "Lexend", "Atkinson Hyperlegible", system-ui, sans-serif; --font-display: "Lexend", system-ui, sans-serif; }
:root[data-font="sistema"] { --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --font-display: system-ui, -apple-system, "Segoe UI", sans-serif; }
:root[data-font="lexend"] h1, :root[data-font="lexend"] h2, :root[data-font="lexend"] h3 { letter-spacing: 0; }
html { font-size: var(--fs); }
:root[data-motion="reduce"] *, :root[data-motion="reduce"] *::before { transition: none !important; animation: none !important; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 1rem; line-height: var(--lh); letter-spacing: var(--ls); word-spacing: var(--ws);
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
mark { background: linear-gradient(transparent 38%, var(--mark) 38%, var(--mark) 92%, transparent 92%); color: var(--mark-ink); padding: 0 2px; }
.app {
  max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px calc(96px + env(safe-area-inset-bottom, 0px));
  display: grid; gap: 16px;
}
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 1.75rem; font-weight: 800; }
h2 { font-size: 1.3rem; font-weight: 750; }
h3 { font-size: 1.08rem; font-weight: 700; }
p { margin: 0; }
small, .muted { color: var(--muted); }
.eyebrow { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--muted); }
.stack { display: grid; gap: 12px; min-width: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spread { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; min-width: 0; }
.card.flat { box-shadow: none; border: 1px solid var(--line); }
.tnum { font-variant-numeric: tabular-nums; }

/* Botones */
.btn {
  border: 0; border-radius: 999px; padding: 11px 18px; font-weight: 700; font-size: .98rem;
  background: var(--accent); color: var(--on-accent); display: inline-flex; align-items: center; gap: 8px; min-height: 44px;
  text-decoration: none; justify-content: center;
}
.btn:active { transform: translateY(1px); }
.btn.ghost { background: var(--accent-soft); color: var(--accent); }
.btn.line { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.small { padding: 7px 13px; min-height: 36px; font-size: .88rem; }
.btn.wide { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.icon-btn { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: .86rem; font-weight: 700; min-height: 36px; display: inline-flex; gap: 6px; align-items: center; color: var(--ink); }
.icon-btn.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

/* Chips de prioridad */
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: .74rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.chip.alta { background: var(--bad-soft); color: var(--bad); }
.chip.media { background: var(--warn-soft); color: var(--warn); }
.chip.baja { background: var(--surface-2); color: var(--muted); }
.chip.done { background: var(--ok-soft); color: var(--ok); }
.chip.fmt { background: var(--accent-soft); color: var(--accent); }

/* Barra de progreso */
.bar { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s ease; }
.bar.ok > i { background: var(--ok); }

/* Inicio */
.hero { background: var(--accent); color: var(--on-accent); border-radius: 20px; padding: 18px; display: grid; gap: 12px; position: relative; overflow: hidden; }
.hero h1 { color: var(--on-accent); }
.hero .sub { opacity: .88; }
.count { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; }
.count b { font-family: var(--font-display); font-size: 3.4rem; line-height: .9; font-weight: 800; }
.hero .bar { background: rgba(255,255,255,.25); }
.hero .bar > i { background: var(--on-accent); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface); border-radius: var(--r); padding: 12px; box-shadow: var(--shadow); display: grid; gap: 2px; min-width: 0; }
.stat b { font-family: var(--font-display); font-size: 1.45rem; font-weight: 800; }
.stat span { font-size: .8rem; color: var(--muted); }
.mission { border-left: 5px solid var(--accent); }
.mission-l { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); border: 0; width: 100%; text-align: left; }
.mission-l .t { flex: 1; min-width: 0; font-weight: 700; }
.mission-l.done { opacity: .6; }
.motiv { font-family: var(--font-display); font-size: 1.05rem; font-weight: 650; }
.compare { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; text-align: center; }
.compare b { font-family: var(--font-display); font-size: 2.2rem; font-weight: 800; display: block; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.badge { border-radius: 12px; padding: 10px 6px; text-align: center; background: var(--surface-2); font-size: .75rem; font-weight: 700; display: grid; gap: 4px; }
.badge .bi { font-size: 1.6rem; filter: grayscale(1); opacity: .35; }
.badge.got { background: var(--accent-soft); color: var(--accent); }
.badge.got .bi { filter: none; opacity: 1; }

/* Ruta */
.world { display: grid; gap: 8px; }
.world-h { display: flex; gap: 10px; align-items: center; }
.world-h .wi { width: 40px; height: 40px; border-radius: 12px; background: var(--accent-soft); display: grid; place-items: center; font-size: 1.25rem; flex: none; }
.lrow { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 12px; border-radius: 12px; background: var(--surface); border: 1.5px solid var(--line); text-align: left; width: 100%; }
.lrow .n { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-weight: 800; font-size: .85rem; color: var(--muted); }
.lrow.done .n { background: var(--ok); border-color: var(--ok); color: var(--on-accent); }
.lrow.started .n { border-color: var(--accent); color: var(--accent); }
.lrow .tt { font-weight: 700; line-height: 1.25; }
.lrow .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 4px; font-size: .8rem; color: var(--muted); }
.mini-bar { width: 54px; }
.filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }

/* Lección: hoja de cuaderno */
.lesson-top { display: grid; gap: 10px; }
.steps-dots { display: flex; gap: 4px; }
.steps-dots i { flex: 1; height: 6px; border-radius: 99px; background: var(--surface-2); }
.steps-dots i.on { background: var(--accent); }
.steps-dots i.cur { background: var(--accent-2); }
.sheet { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px 16px 18px 26px; position: relative; display: grid; gap: 12px; min-width: 0; }
.sheet::before { content: ""; position: absolute; left: 12px; top: 14px; bottom: 14px; width: 2px; background: var(--margin-rule); border-radius: 2px; }
.sheet h2 { color: var(--accent); }
.sheet .body { font-size: 1.06rem; line-height: calc(var(--lh) + .1); }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.en-box { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; font-size: .95rem; display: grid; gap: 6px; }
.en-box .lab { font-size: .72rem; font-weight: 800; letter-spacing: .08em; color: var(--muted); }
.nav-btns { display: flex; gap: 10px; justify-content: space-between; }
.nav-btns .btn { flex: 1; }
.callout { border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; }
.callout.trap { background: var(--bad-soft); }
.callout.trap h3 { color: var(--bad); }
.callout.trick { background: var(--accent-soft); }
.callout.trick h3 { color: var(--accent); }
.callout ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.solved ol { margin: 0; padding-left: 22px; display: grid; gap: 8px; }
.solved li.hide { display: none; }
.answer-box { background: var(--ok-soft); color: var(--ink); border-radius: 12px; padding: 10px 12px; font-weight: 700; }

/* Visuales */
.vis { margin-top: 4px; min-width: 0; }
.pyr { display: grid; gap: 4px; justify-items: center; }
.pyr-row { background: var(--accent); color: var(--on-accent); border-radius: 8px; padding: 7px 10px; text-align: center; display: grid; font-size: .9rem; line-height: 1.25; }
.pyr-row:nth-child(2) { background: var(--accent-2); }
.pyr-row:nth-child(3) { background: color-mix(in srgb, var(--accent) 70%, var(--surface)); }
.pyr-row:nth-child(4) { background: color-mix(in srgb, var(--accent) 55%, var(--surface)); color: var(--ink); }
.pyr-row:nth-child(5) { background: color-mix(in srgb, var(--accent) 35%, var(--surface)); color: var(--ink); }
.pyr-row span { font-size: .78rem; opacity: .9; }
.pyr-note { font-size: .78rem; color: var(--muted); }
.line-wrap { overflow-x: auto; padding-bottom: 6px; }
.line { display: flex; gap: 0; min-width: max-content; position: relative; padding-top: 6px; }
.line-item { width: 132px; display: grid; gap: 4px; justify-items: center; text-align: center; position: relative; padding: 0 6px; }
.line-item::before { content: ""; position: absolute; top: 37px; left: 0; right: 0; height: 3px; background: var(--line); z-index: 0; }
.line-age { font-size: .74rem; font-weight: 800; color: var(--accent); min-height: 2.2em; display: grid; align-items: end; }
.line-dot { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-weight: 800; font-size: .85rem; z-index: 1; }
.line-t { font-weight: 700; font-size: .86rem; line-height: 1.2; }
.line-s { font-size: .76rem; color: var(--muted); line-height: 1.25; }
.flow { display: grid; gap: 4px; }
.flow-step { display: flex; gap: 10px; align-items: flex-start; background: var(--surface-2); border-radius: 10px; padding: 9px 11px; }
.flow-step b { display: block; line-height: 1.25; }
.flow-step small { display: block; line-height: 1.35; margin-top: 2px; }
.flow-n { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-weight: 800; font-size: .8rem; }
.flow-arrow { text-align: center; color: var(--muted); line-height: 1; font-size: .9rem; }
.flow-back { font-size: .85rem; font-weight: 700; color: var(--accent); text-align: center; padding-top: 4px; }
.tbl-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--line); }
.tbl { border-collapse: collapse; width: 100%; font-size: .9rem; min-width: 420px; }
.tbl th { background: var(--accent-soft); color: var(--accent); text-align: left; padding: 8px 10px; font-size: .78rem; letter-spacing: .04em; text-transform: uppercase; }
.tbl td { padding: 8px 10px; border-top: 1px solid var(--line); vertical-align: top; line-height: 1.4; }
.tree { display: grid; gap: 10px; justify-items: center; }
.tree-root { background: var(--accent); color: var(--on-accent); padding: 8px 18px; border-radius: 10px; font-weight: 800; font-family: var(--font-display); }
.tree-kids { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; width: 100%; }
.tree-kid { border: 2px solid var(--accent); border-radius: 10px; padding: 8px; text-align: center; display: grid; }
.tree-kid small { display: block; }
.vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: stretch; }
.vs-col { background: var(--surface-2); border-radius: 10px; padding: 10px; min-width: 0; }
.vs-h { font-weight: 800; font-size: .82rem; letter-spacing: .03em; color: var(--accent); margin-bottom: 6px; }
.vs-col ul { margin: 0; padding-left: 16px; display: grid; gap: 4px; font-size: .9rem; line-height: 1.35; }
.vs-mid { align-self: center; font-weight: 800; color: var(--muted); font-size: .8rem; }
@media (max-width: 460px) { .vs { grid-template-columns: 1fr; } .vs-mid { justify-self: center; } }
.pairs { display: grid; gap: 6px; }
.pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 10px; background: var(--surface-2); border-radius: 10px; padding: 9px 11px; font-size: .92rem; line-height: 1.4; }
@media (max-width: 460px) { .pair { grid-template-columns: 1fr; gap: 2px; } }
.doc { border: 1.5px dashed var(--line); border-radius: 10px; overflow: hidden; }
.doc-h { background: var(--surface-2); padding: 6px 10px; font-size: .78rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.doc-b { padding: 10px 12px; font-size: .95rem; }

/* Preguntas: óvalos de la hoja de respuestas */
.q { display: grid; gap: 12px; }
.q-text { font-size: 1.08rem; font-weight: 600; line-height: var(--lh); }
.passage { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; font-size: .98rem; line-height: calc(var(--lh) + .05); }
.passage h3 { font-size: .98rem; margin-bottom: 6px; }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; min-height: 52px; width: 100%; line-height: 1.35; }
.opt .ov { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--muted); display: grid; place-items: center; font-weight: 800; font-size: .85rem; color: var(--muted); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .ov { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .ov { background: var(--ok); border-color: var(--ok); color: var(--on-accent); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .ov { background: var(--bad); border-color: var(--bad); color: var(--on-accent); }
.opt[disabled] { cursor: default; }
.fb { border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; }
.fb.ok { background: var(--ok-soft); }
.fb.no { background: var(--bad-soft); }
.fb b.h { font-family: var(--font-display); font-size: 1.05rem; }
.fb.ok b.h { color: var(--ok); }
.fb.no b.h { color: var(--bad); }
.hint { background: var(--warn-soft); border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; }
.hint ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.conf { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.conf button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px; font-size: .82rem; font-weight: 700; }
.conf button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.qnav { display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap: 5px; }
.qnav button { height: 34px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); font-size: .78rem; font-weight: 700; }
.qnav button.ans { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.qnav button.cur { outline: 2px solid var(--ink); }
.timer { font-family: var(--font-display); font-weight: 800; font-variant-numeric: tabular-nums; }

/* Resultados */
.grade { display: grid; justify-items: center; gap: 4px; text-align: center; padding: 8px 0; }

.grade > b { font-family: var(--font-display); font-size: 4rem; line-height: 1; font-weight: 800; color: var(--accent); }
.unitbars { display: grid; gap: 10px; }
.unitbar { display: grid; gap: 4px; }

<script>const V = {
  // Pirámide: niveles de ABAJO hacia ARRIBA
  pyr(levels) {
    const n = levels.length;
    const rows = levels.slice().reverse().map((l, i) => {
      const w = 38 + (i * (62 / Math.max(1, n - 1)));
      return `<div class="pyr-row" style="width:${w}%"><b>${l.t}</b>${l.s ? `<span>${l.s}</span>` : ''}</div>`;
    }).join('');
    return `<div class="vis pyr">${rows}<div class="pyr-note">⬆ Se sube de abajo hacia arriba</div></div>`;
  },
  // Línea del tiempo horizontal
  line(items) {
    return `<div class="vis line-wrap"><div class="line">${items.map((it, i) =>
      `<div class="line-item"><div class="line-age">${it.a}</div><div class="line-dot">${i + 1}</div><div class="line-t">${it.t}</div>${it.s ? `<div class="line-s">${it.s}</div>` : ''}</div>`).join('')}</div></div>`;
  },
  // Secuencia de pasos (cycle = proceso que se repite)
  flow(items, cycle) {
    return `<div class="vis flow${cycle ? ' cycle' : ''}">${items.map((it, i) =>
      `<div class="flow-step"><span class="flow-n">${i + 1}</span><div><b>${it.t}</b>${it.s ? `<small>${it.s}</small>` : ''}</div></div>`).join('<div class="flow-arrow" aria-hidden="true">↓</div>')}${cycle ? '<div class="flow-back">↺ Puedes regresar a cualquier paso: el proceso se repite</div>' : ''}</div>`;
  },
  // Tabla
  tbl(head, rows) {
    return `<div class="vis tbl-wrap"><table class="tbl"><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  },
  // Árbol / mapa conceptual simple
  tree(root, kids) {
    return `<div class="vis tree"><div class="tree-root">${root}</div><div class="tree-kids">${kids.map(k =>
      `<div class="tree-kid"><b>${k.t}</b>${k.s ? `<small>${k.s}</small>` : ''}</div>`).join('')}</div></div>`;
  },
  // Dos columnas que se comparan
  vs(a, b) {
    const col = c => `<div class="vs-col"><div class="vs-h">${c.t}</div><ul>${c.items.map(x => `<li>${x}</li>`).join('')}</ul></div>`;
    return `<div class="vis vs">${col(a)}<div class="vs-mid">vs</div>${col(b)}</div>`;
  },
  // Tarjetas término → significado
  pairs(list) {
    return `<div class="vis pairs">${list.map(p => `<div class="pair"><b>${p[0]}</b><span>${p[1]}</span></div>`).join('')}</div>`;
  },
  // Caja de ejemplo (texto modelo)
  doc(title, html) {
    return `<div class="vis doc"><div class="doc-h">${title}</div><div class="doc-b">${html}</div></div>`;
  }
};


/* Diagramas nuevos para el Módulo 2 */
Object.assign(V, {
  // Hamburguesa del texto argumentativo: pan (tesis), relleno (argumentos), pan (conclusión)
  burger(top, mids, bot) {
    return `<div class="vis burger" role="img" aria-label="Hamburguesa: ${top.t}, ${mids.map(m => m.t).join(', ')}, ${bot.t}"><div class="bun top"><b>${top.t}</b>${top.s ? `<small>${top.s}</small>` : ''}</div>${mids.map((m, i) => `<div class="${i % 2 ? 'lett' : 'meat'}"><b>${m.t}</b>${m.s ? `<small>${m.s}</small>` : ''}</div>`).join('')}<div class="bun bot"><b>${bot.t}</b>${bot.s ? `<small>${bot.s}</small>` : ''}</div></div>`;
  },
  // Gráfica de barras sencilla: [[etiqueta, valor], ...]; hi = índice resaltado
  bars(data, unit, hi) {
    const max = Math.max(...data.map(d => d[1]));
    return `<div class="vis" role="img" aria-label="Gráfica de barras: ${data.map(d => d[0] + ' ' + d[1] + (unit || '')).join(', ')}"><div class="bars">${data.map((d, i) => `<div class="b${i === hi ? ' hi' : ''}"><b class="tnum">${d[1]}${unit || ''}</b><i style="height:${Math.max(4, Math.round(d[1] / max * 110))}px"></i></div>`).join('')}</div><div class="bars-x">${data.map(d => `<span>${d[0]}</span>`).join('')}</div></div>`;
  },
  // Gráfica circular (pastel) con leyenda
  pie(data) {
    const cols = ['var(--art-1)', 'var(--art-2)', 'var(--art-3)', 'var(--art-4)', 'var(--muted)'];
    const tot = data.reduce((a, d) => a + d[1], 0); let acc = 0;
    const arcs = data.map((d, i) => {
      const a0 = acc / tot * Math.PI * 2; acc += d[1]; const a1 = acc / tot * Math.PI * 2;
      const x0 = 60 + 56 * Math.sin(a0), y0 = 60 - 56 * Math.cos(a0), x1 = 60 + 56 * Math.sin(a1), y1 = 60 - 56 * Math.cos(a1);
      const large = a1 - a0 > Math.PI ? 1 : 0;
      return `<path d="M60 60L${x0.toFixed(1)} ${y0.toFixed(1)}A56 56 0 ${large} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}z" style="fill:${cols[i % cols.length]}" stroke="var(--surface)" stroke-width="2"/>`;
    }).join('');
    return `<div class="vis pie-wrap"><svg viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Gráfica circular: ${data.map(d => d[0] + ' ' + d[1] + '%').join(', ')}">${arcs}</svg><ul>${data.map((d, i) => `<li><i style="background:${cols[i % cols.length]}"></i><span><b class="tnum">${d[1]}%</b> ${d[0]}</span></li>`).join('')}</ul></div>`;
  },
  // Ciclo de pasos que se repiten (proceso de escritura)
  cycle(items, note) {
    return `<div class="vis cycle">${items.map((it, i) => `<div class="c"><b>${i + 1}. ${it.t}</b>${it.s ? `<small>${it.s}</small>` : ''}</div>`).join('')}<div class="cycle-note">${note || '↺ Puedes regresar a cualquier paso'}</div></div>`;
  },
  // Diagrama de Venn: lo propio de A, lo que comparten, lo propio de B
  venn(a, both, b) {
    const col = (cls, c) => `<div class="${cls}"><h4>${c.t}</h4><ul>${c.items.map(x => `<li>${x}</li>`).join('')}</ul></div>`;
    return `<div class="vis venn">${col('l', a)}${col('m', both)}${col('r', b)}</div>`;
  },
  // Cadena: A → B → C
  chain(items) {
    return `<div class="vis chain">${items.map(x => `<span class="k">${x}</span>`).join('<span class="ar" aria-hidden="true">→</span>')}</div>`;
  },
  // Nube de palabras: resalta las que cumplen (hl)
  cloud(words) {
    return `<div class="vis chip-cloud">${words.map(w => `<span class="${w[1] ? 'hl' : ''}">${w[0]}</span>`).join('')}</div>`;
  }
});

/* ───────── L25 · IDEOLOGÍA, POSTURA E INFERENCIAS ───────── */
L({

  steps: [
    { h: 'Imagina que…', img: 'foco', t: 'Tu amigo dice: «La fiesta estuvo bien… si te gusta esperar dos horas la comida». No dijo «estuvo mal», pero lo <mark>dejó ver</mark>. Leer entre líneas es descubrir lo que el autor piensa aunque no lo diga directamente. Eso se llama <b>inferir</b>.',
      easy: 'Inferir = descubrir lo que el texto da a entender sin decirlo.' },
    { h: 'La expresión ideológica', t: 'En los textos argumentativos el autor muestra sus ideas sobre el tema: si lo ve de forma <b>positiva</b>, <b>negativa</b> o <b>con reservas</b>. Eso es su <mark>expresión ideológica</mark> y determina cómo trata la información.',
      easy: 'Expresión ideológica = lo que el autor piensa del tema.',
      v: () => V.tbl(['Postura', 'Ejemplo sobre las redes sociales'], [

        ['Indiferente', '«Da igual usarlas o no.»']]) },
    { h: 'Vamos paso por paso: cómo inferir', t: 'El libro sugiere dos lecturas:',

    { h: 'Mecanismos discursivos y autoría', t: 'Los temas, subtemas, conectores y el vocabulario que elige el autor son <b>mecanismos discursivos</b>: le dan su <mark>sello personal</mark>. Por eso siempre hay que reconocer la autoría de las ideas de otros.',

    { lvl: 's', q: '¿Qué es la expresión ideológica de un autor?', o: ['El número de páginas del texto', 'Las ideas que presenta sobre el tema, que muestran si piensa positiva o negativamente', 'El nombre de la editorial', 'La tipografía del texto'], a: 1,
      pista: 'Ideología = ideas.',
      why: 'Muestra lo que piensa el autor y determina cómo trata la información.',
      oe: ['Es un dato físico.', '¡Correcto!', 'Es un dato de la fuente.', 'Es diseño.'] },
    { lvl: 'i', q: 'Para inferir el contenido implícito de un texto, el libro recomienda:', o: ['Leer solo el título', 'Una segunda lectura para identificar opiniones y premisas a favor o en contra', 'Copiar el texto completo', 'Contar las palabras'], a: 1,
      why: 'Tras identificar los hechos, una segunda lectura revela las opiniones y la postura.',

/* ───────── L26 · LECTURA CRÍTICA: FALACIAS Y REFUTACIÓN ───────── */

      easy: 'Falacia = un razonamiento que parece bueno pero está mal hecho.' },
    { h: '¿Qué es una falacia?', t: 'Para Copi y Cohen, es un argumento que puede parecer correcto, pero que al revisarlo bien se prueba que no lo es. Yolanda Argudín la define como una forma de fundamentar <b>incorrecta o tendenciosa</b>. Ejemplos del libro:',
      easy: 'Si la conclusión no tiene suficientes pruebas, desconfía.',
      v: () => V.tbl(['Falacia', 'Ejemplo', 'Por qué falla'], [
        ['<b>Causa falsa</b>', '«Desde que enseñan X, hay más problemas Y»', 'Que dos cosas pasen juntas no prueba que una cause la otra'],
        ['<b>Composición</b>', '«Las partes son redondas, así que el todo es redondo»', 'Lo que vale para las partes no siempre vale para el todo'],
        ['<b>Generalización / apelar a emociones</b>', '«Toda la gente de pueblo es buena amiga»', 'Juzga a todos por igual y busca conmover']]) },
    { h: 'Refutar y contraargumentar', t: '<b>Refutar</b> es contradecir con razonamientos lo que alguien presentó como verdad. <b>Contraargumentar</b> es argumentar contra un argumento. También hay un recurso indebido: <mark>afirmar sin dar pruebas</mark>. Un lector crítico se pregunta: ¿con qué base lo afirma? ¿se puede verificar?',
      easy: 'Refutar = demostrar con razones que algo no es cierto.',
      v: () => V.vs({ t: 'Afirmación', items: ['«La televisión es una caja idiota que solo enseña malas mañas.»'] }, { t: 'Refutación', items: ['«Depende de lo que se vea: hay canales con contenidos de cultura, ciencia y política muy recomendables.»'] }) },
    { h: 'La actitud del lector crítico', t: 'Si no estás de acuerdo con la tesis de un texto, lo correcto es <mark>analizar la validez de sus argumentos y contrastarlos con otras fuentes, respetando el punto de vista del autor</mark>. Hay que ser <b>tolerante</b>: no ignorar lo que no coincide contigo, ni rechazar sin leer, ni aceptar solo porque está bien escrito.',
      easy: 'Lee todo, revisa las pruebas, compara fuentes y respeta otras opiniones.' }
  ],
  trap: [

  ],
  trick: 'El lector crítico es como un <b>juez</b>: escucha a las dos partes, revisa las pruebas y decide con respeto.',
  ex: { q: 'Si un lector no está de acuerdo con la tesis de un texto, ¿cuál es la actitud más adecuada desde la lectura crítica?', pasos: ['Descarta ignorar argumentos o rechazar sin leer.', 'Descarta aceptar solo por la forma.', 'Elige analizar, contrastar y respetar.'], a: 'Analizar la validez de los argumentos y contrastarlos con otras fuentes, respetando el punto de vista del autor.' },
  prac: [

      pista: 'Fíjate en «la única causa».',

    { lvl: 'i', q: 'Refutar significa:', o: ['Repetir lo que dijo el autor', 'Contradecir con razonamientos lo que alguien presentó como verdad', 'Resumir un texto', 'Aceptar sin dudar'], a: 1,

/* BANCO DE REACTIVOS (originales) · t = tema, q = pregunta, o = opciones, a = índice correcto, e = explicación */

/* HECHO HISTÓRICO */

Q('fenomeno', 'Una pregunta generadora tiene como característica:', ['Se responde con sí o no', 'Puede generar diversas respuestas y requiere una explicación argumentada', 'Ya tiene la respuesta en el título', 'Siempre es una pregunta retórica'], 1, 'No son preguntas cerradas; exigen explicación extensa.');

Q('cientifico', 'Característica del texto científico que presenta las ideas sin valoraciones personales:', ['Objetividad', 'Claridad', 'Universalidad', 'Ironía'], 0, 'La objetividad evita juicios del autor.');
Q('cientifico', 'Un científico sustenta su trabajo principalmente en:', ['Opiniones', 'Datos: hechos comprobados y demostrados', 'Rumores', 'Refranes'], 1, 'La cientificidad radica en los datos demostrados.');

Q('tecnicismos', '¿Para qué emplea un autor expresiones como «sequía hidrológica»?', ['Para entretener', 'Para opinar', 'Para nombrar con precisión conceptos del campo científico', 'Para persuadir'], 2, 'El léxico especializado aporta precisión.');

/* TEMAS Y RESUMEN */
Q('temas', 'Un texto define el sargazo, explica sus causas, sus efectos y cómo se vigila. ¿Cuál es su tema principal?', ['Las playas del Caribe', 'El sargazo: qué es, causas, efectos y vigilancia', 'La pesca', 'El turismo'], 1, 'El tema principal abarca todo el texto.');

Q('temas', 'En los artículos de investigación científica, el resumen que aparece al inicio se llama:', ['Índice', 'Abstract', 'Prólogo', 'Glosario'], 1, 'Así lo explica el libro.');
Q('temas', 'Un cuadro sinóptico, un mapa conceptual o un mapa mental son un tipo de resumen llamado:', ['Esquema', 'Síntesis', 'Paráfrasis', 'Reseña'], 0, 'El esquema organiza la información más importante.');

Q('periodisticos', 'Si un periodista escribiera una nota informativa sobre la sequía en una comunidad, ¿qué cambiaría respecto de un texto de divulgación?', ['Expresaría solo emociones, sin datos', 'Omitiría fechas y lugares', 'Usaría más tecnicismos', 'Priorizaría datos concretos del hecho (qué, quién, cuándo, dónde) con vocabulario más accesible'], 3, 'La nota responde a las preguntas básicas con lenguaje sencillo.');

Q('proyecto', 'Las fases de una investigación documental son: diseño del proyecto, ______ y redacción del escrito.', ['acopio y procesamiento de la información', 'publicidad', 'votación', 'memorización'], 0, 'Así se organiza la Unidad 3.', { f: 'completar' });

Q('fichas', 'Ordena las fases de elaboración de una ficha de comentario: I. Identificar el tipo de texto y su contexto de producción · II. Emitir un juicio de valor sobre su objetividad, utilidad y calidad · III. Identificar las ideas principales y conceptos · IV. Evaluar el contenido (argumentos, datos, respaldos, gráficos) · V. Confrontar la información con los conocimientos propios para llegar a una conclusión', ['V, II, I, IV y III', 'IV, III, V, II y I', 'I, V, II, III y IV', 'III, I, IV, V y II'], 3, 'Lectura analítica → clasificación → análisis → comentario → valoración crítica.', { f: 'ordenar' });

const PASSAGES = {
  h1: { u: 1, title: 'Texto 1. El sismo del 19 de septiembre de 1985', text: 'El 19 de septiembre de 1985, a las 7:19 de la mañana, un sismo de magnitud 8.1 con epicentro frente a las costas de Michoacán sacudió el centro y el occidente de México. En la Ciudad de México cientos de edificios se derrumbaron, sobre todo en colonias del centro, y miles de personas murieron; las cifras varían según la fuente consultada.\n\nAntes de que llegara la ayuda oficial, vecinos, estudiantes y trabajadores formaron brigadas para remover escombros y rescatar a personas atrapadas. Por ello, muchos historiadores consideran que esos días mostraron una nueva forma de organización ciudadana.\n\nAl año siguiente se creó el Sistema Nacional de Protección Civil y, años después, comenzó a funcionar una alerta sísmica en la capital. Desde entonces, cada 19 de septiembre se realizan simulacros en escuelas y oficinas.',
    title2: 'Texto 2. Lo que la tierra nos enseñó (columna de opinión)', text2: 'Cada septiembre repetimos el simulacro, tomamos la foto y regresamos a la oficina. Me parece que hemos convertido la memoria en un trámite. Es cierto que hoy existe una alerta que nos da segundos valiosos; sin embargo, seguimos construyendo sin respetar las normas, como si la tierra fuera a olvidar.\n\nPor eso sostengo que recordar no basta: hay que exigir. ¿De qué sirve sonar la alarma si el edificio de al lado no debió levantarse? La verdadera lección de 1985 no fue el miedo, sino la solidaridad que nació en la calle.' },
  h2: { u: 1, title: 'Texto 1. La expropiación petrolera de 1938', text: 'El 18 de marzo de 1938, el presidente Lázaro Cárdenas anunció por radio la expropiación de los bienes de las compañías petroleras extranjeras que operaban en México. La decisión llegó después de un largo conflicto laboral: los trabajadores exigían mejores salarios y condiciones, y las empresas se negaron a cumplir lo que había resuelto la Suprema Corte de Justicia.\n\nEn las semanas siguientes, miles de personas acudieron a donar dinero, joyas e incluso animales para ayudar a pagar la indemnización. El 7 de junio de ese año se creó Petróleos Mexicanos (Pemex) para administrar la industria.\n\nDesde entonces, el 18 de marzo se recuerda como una fecha de soberanía nacional, aunque los especialistas coinciden en que fue resultado de un proceso largo y no de una sola decisión.',
    title2: 'Texto 2. Un aniversario, muchas preguntas (columna de opinión)', text2: 'Cada 18 de marzo se repiten los discursos sobre la soberanía. Me parece justo recordar a quienes donaron lo poco que tenían; sin embargo, celebrar sin mirar el presente es quedarse a la mitad. Hoy el reto no es solo tener el petróleo, sino decidir qué energía queremos para el futuro.\n\nPor eso considero que la mejor forma de honrar aquella fecha es discutir con información, no con nostalgia. ¿Qué sentido tiene presumir el pasado si no pensamos en lo que heredaremos a nuestros hijos?' },
  n1: { u: 2, title: 'Texto 3. El sargazo: una marea que llega del mar', text: 'El sargazo es una macroalga de color café que flota en el océano Atlántico gracias a unas pequeñas vesículas llenas de aire. En mar abierto sirve de refugio a peces, tortugas y crustáceos; sin embargo, cuando llega en grandes cantidades a la costa, se acumula en las playas y se descompone.\n\nLos especialistas distinguen dos problemas. El ambiental aparece cuando la descomposición libera gases de olor desagradable y reduce el oxígeno del agua cercana a la orilla. El económico se presenta cuando las playas cubiertas alejan a los turistas y afectan la pesca.\n\nEntre las causas se mencionan el aumento de la temperatura del mar y los nutrientes que llegan al océano por los ríos y los fertilizantes. Por ello, estudiar el sargazo exige el trabajo conjunto de la oceanografía, la biología marina, la química y la economía.\n\nPara darle seguimiento, se elaboran registros de la cantidad recogida en las playas. La siguiente tabla, con datos ficticios elaborados para este simulacro, muestra cómo se presenta esa información.',

  n2: { u: 2, title: 'Texto 3. Las ondas de calor', text: 'Una onda de calor es un periodo de varios días consecutivos en que la temperatura máxima supera de manera inusual los valores normales de una región. A diferencia de una tormenta, que se ve venir con nubes y viento, el calor extremo avanza en silencio, por lo que muchas personas no se protegen a tiempo.\n\nSus efectos son de varios tipos. En la salud, provoca deshidratación y golpes de calor, sobre todo en niños y adultos mayores. En el campo, seca los cultivos y reduce las cosechas. En las ciudades, aumenta el consumo de electricidad por el uso de ventiladores y aires acondicionados.\n\nEntre las causas se encuentran los patrones naturales del clima y el calentamiento global provocado por la emisión de gases de efecto invernadero. Por ello, su estudio reúne a la meteorología, la medicina, la agronomía y la ingeniería eléctrica.\n\nLa siguiente tabla, con datos ficticios elaborados para este simulacro, muestra los días con más de 40 °C registrados en una ciudad.',

  s1: { u: 3, title: 'Texto 4. Vecinos en línea (artículo de opinión)', text: 'Los grupos de mensajes del celular pueden fortalecer la vida de una colonia, pero solo si se usan para algo más que quejarse. Cuando falta el agua o hay un bache peligroso, el chat se vuelve una ventanilla abierta las 24 horas.\n\nEn primer lugar, estos grupos informan con rapidez: un aviso de corte de luz llega a cientos de vecinos en minutos. En segundo lugar, facilitan organizarse; por ejemplo, en muchas colonias se han reunido cooperaciones para arreglar luminarias en una sola tarde.\n\nSin embargo, un mensaje con emojis de enojo no tapa un bache ni presenta una solicitud al municipio. ¿De qué sirve indignarse en el chat si nadie asiste a la junta?\n\nEn conclusión, el grupo vecinal será una herramienta de participación real si quienes lo forman también se reúnen, se informan en fuentes confiables y exigen cuentas a sus autoridades.' },
  s2: { u: 3, title: 'Texto 4. El presupuesto también es nuestro (artículo de opinión)', text: 'El presupuesto participativo, en el que los vecinos votan en qué se gasta una parte del dinero público de su colonia, es una de las mejores herramientas de la democracia, siempre y cuando la ciudadanía se informe antes de votar.\n\nEn primer lugar, acerca las decisiones a quienes conocen los problemas: nadie sabe mejor dónde hace falta una lámpara que quien camina de noche por esa calle. Además, obliga a las autoridades a rendir cuentas, porque los proyectos ganadores quedan a la vista de todos.\n\nNo obstante, en muchas consultas vota muy poca gente y algunos proyectos se eligen sin conocerlos. Votar sin información es como firmar un contrato sin leerlo.\n\nPor lo tanto, el presupuesto participativo solo cumplirá su promesa si las escuelas, los medios y los propios vecinos hacen de la información una costumbre y no un trámite.' },
  c1: { u: 3, title: 'Leer en papel o en pantalla', text: 'Muchas personas creen que leer en una pantalla es igual que leer en papel. Sin embargo, varios estudios han encontrado que, en textos largos, recordamos mejor lo leído en papel, quizá porque en la pantalla saltamos de una línea a otra y nos distraen las notificaciones. Por ejemplo, un estudiante que lee un capítulo impreso suele poder ordenar mejor las ideas que quien lo leyó en el celular. Por eso, conviene imprimir o leer sin interrupciones los textos que necesitamos estudiar.' },
  c2: { u: 3, title: 'Mi primera brigada', text: 'Yo tenía diecisiete años cuando sonó la alerta. Corrí a la calle con mi hermana y vimos que el edificio de la esquina se había venido abajo. Sin pensarlo, nos formamos en una fila con los vecinos y pasamos cubetas con escombro de mano en mano. Después de tres horas, alguien gritó que había escuchado una voz. Nos quedamos en silencio. Más tarde sacaron a una señora con vida. Esa noche no pude dormir, pero entendí que la ayuda más grande empieza con un vecino que no se queda mirando.' },
  c3: { u: 3, title: 'La milpa', text: 'La milpa es un sistema de cultivo de origen mesoamericano en el que se siembran juntos, principalmente, maíz, frijol y calabaza. Cada planta ayuda a las otras: el maíz sirve de soporte para que el frijol trepe; el frijol aporta nitrógeno al suelo, y las hojas grandes de la calabaza dan sombra, conservan la humedad y reducen las hierbas no deseadas. Además de producir alimentos variados, la milpa protege la fertilidad de la tierra. Por estas razones, hoy se estudia como un ejemplo de agricultura sostenible.' }

      <p class="muted" style="font-size:.9rem">Prueba hasta que leer te resulte cómodo. Se guarda en este dispositivo.</p>
      <div class="set-row"><b>Tamaño de letra</b>${segBtns('fs', [[15, 'A−'], [17, 'A'], [19, 'A+'], [22, 'A++']])}</div>
      <div class="set-row"><b>Tipo de letra</b><small>Lexend y Atkinson están pensadas para leer con facilidad (útiles con dislexia).</small>${segBtns('font', [['atkinson', 'Atkinson'], ['lexend', 'Lexend'], ['sistema', 'Del teléfono']])}</div>
      ${swRow('spacing', 'Espaciado amplio', 'Más espacio entre líneas, letras y palabras.')}
      <div class="set-row"><b>Colores</b>${segBtns('theme', [['auto', 'Automático'], ['light', 'Claro'], ['dark', 'Oscuro']])}</div>
      <div class="set-row"><b>Fondo suave (modo claro)</b><small>Un fondo de color reduce el brillo y ayuda a algunas personas a leer.</small>${segBtns('tint', [['none', 'Blanco'], ['crema', 'Crema'], ['azul', 'Azul'], ['verde', 'Verde']])}</div>
      ${swRow('ruler', 'Regla de lectura', 'Una franja que sigue tu dedo o el ratón para no perder el renglón.')}
      ${swRow('focus', 'Modo enfoque', 'Oculta frases, estadísticas y extras para concentrarte.')}
      ${swRow('easy', 'Mostrar siempre «Más fácil»', 'Cada explicación trae su versión corta.')}
      ${swRow('auto', 'Leer en voz alta al abrir cada explicación')}
      <div class="set-row"><label for="rate"><b>Velocidad de la voz: <span id="rateV" class="tnum">${S.settings.rate.toFixed(2)}</span></b></label><input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="${S.settings.rate}"></div>
      ${swRow('hideTimer', 'Ocultar el cronómetro en los simulacros', 'El tiempo sigue contando, pero no lo ves (menos presión).')}
      ${swRow('motion', 'Reducir animaciones')}
      <div class="set-row"><b>Duración de la sesión corta</b>${segBtns('session', [[10, '10 min'], [15, '15 min'], [25, '25 min']])}</div>
    </div></div>`;
  }
  function modalHTML() {
    if (UI.confirm) return `<div class="sheet-modal" role="dialog" aria-modal="true"><div class="panel"><p style="font-weight:700">${esc(UI.confirm.msg)}</p><div class="nav-btns"><button class="btn line" data-a="${UI.confirm.no}">Cancelar</button><button class="btn" data-a="${UI.confirm.yes}">Sí, continuar</button></div></div></div>`;
    if (UI.modal === 'aa') return aaPanel();
    if (UI.modal === 'gloss') return `<div class="sheet-modal" role="dialog" aria-modal="true" aria-label="Glosario"><div class="panel"><div class="spread"><h2>Glosario</h2><button class="icon-btn" data-a="closeModal">Cerrar</button></div><input class="search" id="glossQ" type="search" placeholder="Busca una palabra" aria-label="Buscar palabra" autocomplete="off"><div id="glossList">${glossList('')}</div></div></div>`;
    if (UI.modal === 'breath') return `<div class="sheet-modal" role="dialog" aria-modal="true" aria-label="Respiración"><div class="panel"><div class="breath"><div class="breath-c" id="breathC" aria-live="polite">Prepárate</div><p class="muted" id="breathT">Inhala 4 · sostén 4 · exhala 4</p></div><button class="btn line" data-a="closeModal">Terminar</button></div></div>`;
    if (UI.modal === 'ground') return `<div class="sheet-modal" role="dialog" aria-modal="true" aria-label="Ejercicio 5-4-3-2-1"><div class="panel ground"><h2>Ejercicio 5-4-3-2-1</h2><p class="muted">Sirve para regresar al presente cuando la mente va muy rápido. Hazlo despacio.</p><ol><li>Nombra <b>5 cosas que ves</b> a tu alrededor.</li><li>Toca <b>4 cosas</b> y siente su textura.</li><li>Escucha <b>3 sonidos</b>.</li><li>Identifica <b>2 olores</b> (o 2 que te gusten).</li><li>Di <b>1 cosa</b> buena de ti o de tu día.</li></ol><p class="muted">Después respira lento tres veces. Puedes volver a estudiar cuando te sientas listo o lista.</p><button class="btn" data-a="closeModal">Listo</button></div></div>`;
    return '';
  }
  let breathH = null;
  function runBreath() {
    clearInterval(breathH); let n = 0; const seq = [['Inhala', true], ['Sostén', true], ['Exhala', false]];
    const tick = () => { const c = $('#breathC'); if (!c) { clearInterval(breathH); return; } if (n >= 9) { c.textContent = '¡Listo!'; c.classList.remove('in'); clearInterval(breathH); return; } const s = seq[n % 3]; c.textContent = s[0]; c.classList.toggle('in', s[1]); n++; };
    setTimeout(tick, 600); breathH = setInterval(tick, 4000);
  }
  /* Sesión corta (ayuda a enfocarse) */
  let SES = null, sesH = null;
  function sessionChip() { if (!SES) return ''; const left = Math.max(0, SES.end - Date.now()); return `<button class="timer-chip" data-a="sessionStop" aria-label="Sesión de estudio: toca para terminar">⏱ <span id="sesT" class="tnum">${fmtLeft(Math.ceil(left / 1000))}</span> · terminar</button>`; }
  function startSession() {
    SES = { end: Date.now() + S.settings.session * 60000 }; clearInterval(sesH);
    sesH = setInterval(() => { const el = $('#sesT'); const left = Math.ceil((SES.end - Date.now()) / 1000); if (left <= 0) { clearInterval(sesH); SES = null; render(); toast('¡Terminó tu sesión! Levántate, toma agua y descansa 5 minutos.'); return; } if (el) el.textContent = fmtLeft(left); }, 1000);
    render(); toast(`Sesión de ${S.settings.session} minutos. Silencia tu celular. ¡Tú puedes!`);
  }

  /* ═════════ RENDER ═════════ */
  const VIEWS = { home: vHome, route: vRoute, lesson: vLesson, quiz: vQuiz, results: vResults, practice: vPractice, review: vReview, flash: vFlash, tf: () => vTF(false), speed: () => vTF(true), order: vOrder, match: vMatch, keys: vKeys, gloss: vGloss, exam: vExam, map: vMap, progress: vProgress, plan: vPlan, calm: vCalm };
  function render(top) {
    const root = $('#app');
    const focusId = document.activeElement && document.activeElement.id;
    root.innerHTML = `<main class="app" id="main">${(VIEWS[UI.view] || vHome)()}</main>${tabbar()}${sessionChip()}${modalHTML()}`;
    if (top) window.scrollTo({ top: 0 });
    refreshSpeak();
    if (UI.quiz && UI.view === 'quiz' && UI.quiz.limit) { const el = $('#timer'); const left = UI.quiz.limit - Math.floor((Date.now() - UI.quiz.start) / 1000); if (el) el.textContent = fmtLeft(Math.max(0, left)); }
    if (focusId && UI.modal === 'aa') { const el = document.getElementById(focusId); if (el) el.focus(); }
  }

  /* ═════════ ACCIONES ═════════ */
  function readProfile() {
    const v = id => { const el = document.getElementById(id); return el ? el.value.trim() : null; };
    const p = S.profile; const n = v('pfName'), e = v('pfExam'), t = v('pfTime'), pl = v('pfPlace');
    if (n !== null) p.name = n.slice(0, 40); if (e !== null) p.exam = e; if (t !== null) p.time = t; if (pl !== null) p.place = pl.slice(0, 120);
    if (!p.start || (p.exam && p.start > p.exam)) p.start = today();
    if (p.exam && p.exam < today()) toast('Esa fecha ya pasó. Revisa la fecha de tu examen.');
    p.setupDone = true; PLAN = buildPlan(); save();
  }
  const A = {
    go(d) { stopSpeak(); if (d.v === 'order') ORD = null; if (d.v === 'match') MAT = null; if (d.v === 'tf' || d.v === 'speed') { TFS = null; clearInterval(speedH); } if (d.v === 'flash') FL = null; UI.modal = null; UI.view = d.v; render(true); },
    open(d) { openLesson(d.id); },
    openStep(d) { openLesson(d.id, Number(d.s)); },
    filter(d) { UI.routeFilter = d.f; render(); },
    speak(d) { const s = SPEAK_TXT[d.speak]; if (s) speak(s, d.speak); },
    easy(d) { UI.easyOpen[d.k] = !UI.easyOpen[d.k]; if (S.settings.easy) { S.settings.easy = false; save(); } render(); },
    nextStep() {
      const l = LMAP[UI.lesson]; const cards = lessonCards(l); stopSpeak();
      if (UI.step < cards.length - 1) { UI.step++; UI.hintN = 0; UI.exN = 0; }
      S.pos[l.id] = UI.step; touch();
      if (cards[UI.step].k === 'end' && !S.done[l.id]) { S.done[l.id] = today(); addXP(60); checkBadges(); }
      save(); render(true); if (S.settings.auto) setTimeout(autoRead, 250);
    },
    prevStep() { stopSpeak(); if (UI.step > 0) { UI.step--; UI.hintN = 0; UI.exN = 0; } render(true); },
    exNext() { UI.exN = (UI.exN || 0) + 1; render(); },
    hintNext() { UI.hintN = (UI.hintN || 0) + 1; render(); },
    pracAns(d) { const l = LMAP[UI.lesson]; const c = lessonCards(l)[UI.step]; const p = l.prac[c.i]; const k = Number(d.k); UI.prac[c.i] = k; const ok = k === p.a; record(l.id, ok); const key = `${l.id}-${c.i}`; if (ok && !S.practiced[key]) { S.practiced[key] = 1; addXP(10); } else touch(); render(); },
    startMini(d) { QUIZ.mini(d.t); }, startMiniSel() { QUIZ.mini($('#topicSel').value); }, startParcial(d) { QUIZ.parcial(Number(d.u)); }, startFinal() { QUIZ.final(); }, startEva() { QUIZ.eva(); }, startErrors() { QUIZ.errors(); },
    qAns(d) { const z = UI.quiz; if (z.mode === 'learn' && z.checked[z.i]) return; z.ans[z.i] = Number(d.k); render(); },
    qConf(d) { const z = UI.quiz; z.conf[z.i] = z.conf[z.i] === d.c ? undefined : d.c; render(); },
    qCheck() { const z = UI.quiz; z.checked[z.i] = true; const q = QMAP[z.items[z.i].id]; const ok = z.ans[z.i] === q.a; record(q.t, ok); if (ok) { addXP(5); if (S.wrong[q.id]) S.wrong[q.id] = Math.max(0, S.wrong[q.id] - 1); } else { S.wrong[q.id] = (S.wrong[q.id] || 0) + 1; touch(); } save(); render(); },
    qNext() { const z = UI.quiz; stopSpeak(); if (z.i + 1 < z.items.length) { z.i++; render(true); } else if (z.mode === 'learn') learnFinish(); else render(); },
    qPrev() { const z = UI.quiz; stopSpeak(); if (z.i > 0) { z.i--; render(true); } },
    qGo(d) { UI.quiz.i = Number(d.k); render(true); },
    qFinish() { finishQuiz(false); }, qFinishForce() { UI.confirm = null; finishQuiz(true); },
    quitQuiz() { UI.confirm = { msg: '¿Salir del simulador? Perderás las respuestas de este intento.', yes: 'quitYes', no: 'closeConfirm' }; render(); },
    quitYes() { clearInterval(timerH); UI.confirm = null; UI.quiz = null; UI.view = 'practice'; stopSpeak(); render(true); },
    closeConfirm() { UI.confirm = null; render(); },
    gloss() { UI.modal = 'gloss'; render(); setTimeout(() => { const i = $('#glossQ'); if (i) i.focus(); }, 50); },
    aa() { UI.modal = 'aa'; render(); },
    breath() { UI.modal = 'breath'; render(); runBreath(); },
    ground() { UI.modal = 'ground'; render(); },
    session() { startSession(); }, sessionStop() { clearInterval(sesH); SES = null; render(); toast('Sesión terminada. ¡Bien hecho!'); },
    calmOpen() { stopSpeak(); UI.modal = null; UI.view = 'calm'; render(true); },
    feel(d) { S.feel = d.k; save(); checkBadges(); render(); },
    closeModal() { UI.modal = null; clearInterval(breathH); render(); },
    setSeg(d) { const n = Number(d.v); S.settings[d.k] = Number.isNaN(n) ? d.v : n; save(); applySettings(); render(); },
    saveProfile() { readProfile(); toast(hasExam() ? 'Listo: tu plan se ajustó a la fecha de tu examen.' : 'Guardado. Cuando sepas la fecha, ponla aquí.'); render(true); },
    skipProfile() { S.profile.setupDone = true; save(); render(); },
    flFlip() { FL.flip = !FL.flip; const el = document.querySelector('.flip'); if (el) el.classList.toggle('on', FL.flip); },
    flNext(d) { if (d.k === '1') { if (!S.flash[FL.list[FL.i]]) { S.flash[FL.list[FL.i]] = 1; addXP(2); } } else { delete S.flash[FL.list[FL.i]]; touch(); } FL.i = (FL.i + 1) % FL.list.length; FL.flip = false; checkBadges(); save(); render(); },
    tfAns(d) { const it = TF[TFS.list[TFS.i]]; const ok = (d.v === '1') === it[1]; if (ok) { TFS.ok++; addXP(2); } else touch(); TFS.last = { ok, txt: (it[1] ? 'Verdadero. ' : 'Falso. ') + it[2] }; TFS.i++; if (TFS.speed && TFS.i >= TFS.list.length) TFS.list = TFS.list.concat(shuffle(TF.map((_, i) => i))); render(); },
    speedGo() { TFS.start = Date.now(); clearInterval(speedH); render(); speedH = setInterval(() => { const left = 60 - Math.floor((Date.now() - TFS.start) / 1000); const el = $('#spTimer'); if (el) el.textContent = left; if (left <= 0) { clearInterval(speedH); TFS.over = true; if (TFS.ok > S.tfBest) S.tfBest = TFS.ok; checkBadges(); save(); render(); } }, 250); },
    tfAgain() { const sp = TFS.speed; TFS = null; clearInterval(speedH); UI.view = sp ? 'speed' : 'tf'; render(true); },
    ordStart(d) { const g = ORDER_GAMES.find(x => x.id === d.id); let cur = shuffle(g.items); while (cur.every((x, i) => x === g.items[i])) cur = shuffle(g.items); ORD = { id: d.id, cur, checked: false }; render(true); },
    ordBack() { ORD = null; render(true); },
    ordMv(d) { const k = Number(d.k), j = k + Number(d.d); if (j < 0 || j >= ORD.cur.length) return; [ORD.cur[k], ORD.cur[j]] = [ORD.cur[j], ORD.cur[k]]; ORD.checked = false; render(); },
    ordCheck() { ORD.checked = true; const g = ORDER_GAMES.find(x => x.id === ORD.id); if (ORD.cur.every((x, i) => x === g.items[i]) && !S.games[g.id]) { S.games[g.id] = 1; addXP(20); checkBadges(); } else touch(); save(); render(); },
    matStart(d) { const g = MATCH_GAMES.find(x => x.id === d.id); const idx = g.pairs.map((_, i) => i); MAT = { id: d.id, L: shuffle(idx), R: shuffle(idx), done: {}, selL: null, err: null }; render(true); },
    matBack() { MAT = null; render(true); },
    matL(d) { MAT.selL = Number(d.i); MAT.err = null; render(); },
    matR(d) { const i = Number(d.i); if (MAT.selL === null) { toast('Primero toca un concepto de la izquierda.'); return; } if (i === MAT.selL) { MAT.done[i] = 1; MAT.selL = null; MAT.err = null; const g = MATCH_GAMES.find(x => x.id === MAT.id); if (Object.keys(MAT.done).length === g.pairs.length && !S.games[g.id]) { S.games[g.id] = 1; addXP(20); checkBadges(); } touch(); } else MAT.err = i; render(); },
    copyShare() { const t = shareText(); if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => toast('Copiado. Pégalo en WhatsApp.'), () => selectShare()); else selectShare(); },
    askReset() { UI.confirm = { msg: '¿Borrar todo tu avance en este dispositivo? No se puede deshacer.', yes: 'doReset', no: 'closeConfirm' }; render(); },
    doReset() { S = defaults(); save(); PLAN = buildPlan(); UI.confirm = null; UI.view = 'home'; applySettings(); render(true); toast('Avance borrado.'); }
  };
  function selectShare() { const el = $('#shareTxt'); if (!el) return; const r = document.createRange(); r.selectNodeContents(el); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); toast('Texto seleccionado: cópialo.'); }
  function learnFinish() {
    const z = UI.quiz; let c = 0; const topics = {}; const review = [];
    z.items.forEach((it, k) => { const q = QMAP[it.id]; const ok = z.ans[k] === q.a; if (ok) c++; topics[q.t] = topics[q.t] || [0, 0]; topics[q.t][1]++; if (ok) topics[q.t][0]++; review.push({ k, id: q.id, ok, sel: z.ans[k], order: it.order }); });
    UI.review = { type: z.type, title: z.title, date: today(), c, n: z.items.length, grade: grade10(c, z.items.length), units: { 1: [0, 0], 2: [0, 0], 3: [0, 0] }, topics, review };
    if (z.topic) S.games['mini-' + z.topic] = 1;
    UI.quiz = null; UI.view = 'results'; checkBadges(); save(); render(true);
  }

  document.addEventListener('click', e => { const el = e.target.closest('[data-a]'); if (!el) return; const fn = A[el.dataset.a]; if (fn) { e.preventDefault(); fn(el.dataset, el); } });
  document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.flip')) { e.preventDefault(); A.flFlip(); } if (e.key === 'Escape' && (UI.modal || UI.confirm)) { UI.modal = null; UI.confirm = null; render(); } });
  document.addEventListener('input', e => {
    if (e.target.id === 'glossQ') { const l = $('#glossList'); if (l) l.innerHTML = glossList(e.target.value); }
    if (e.target.id === 'rate') { S.settings.rate = Number(e.target.value); const v = $('#rateV'); if (v) v.textContent = S.settings.rate.toFixed(2); save(); }
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'flTopic') { initFlash(t.value); render(); }
    if (t.dataset.a2 === 'chk') { S.checks[t.dataset.i] = t.checked; save(); }
    if (t.dataset.a2 === 'setSw') { S.settings[t.dataset.k] = t.checked; save(); applySettings(); }
  });

  applySettings();
  checkBadges();
  render();
})();
</script>
</body></html>
